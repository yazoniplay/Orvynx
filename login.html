<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Log in — Orvynx</title>
<meta name="description" content="Log in to your Orvynx account.">

<link rel="stylesheet" href="style.css">

</head><body class="auth-page"><main class="auth-container">

    <a href="index.html" class="auth-logo">
        orvynx<span>.</span>
    </a>

    <div class="auth-card">

        <div class="auth-header">
            <p class="eyebrow">WELCOME BACK</p>

            <h1>Log in.</h1>

            <p>
                Access your Orvynx workspace.
            </p>
        </div>

        <form id="loginForm">

            <label>
                Email

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@company.com"
                    required
                >
            </label>

            <label>
                Password

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Your password"
                    required
                >
            </label>

            <button type="submit" class="auth-submit">
                Log in
                <span>→</span>
            </button>

            <p id="authMessage" class="auth-message"></p>

        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="signup.html">Create one</a>
        </div>

    </div>

</main>

<script src="auth.js"></script>

</body>
</html>
